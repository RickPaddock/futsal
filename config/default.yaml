# 3-Pass Futsal Video Analysis Pipeline Configuration

# Model Paths
models:
  player: "models/PLAYER_MODEL_best_v1.pt"
  ball: "models/BALL_MODEL_best_v2.pt"
  jersey: "models/JERSEY_MODEL_best_v1.pt"

# Detection Thresholds
detection:
  player_confidence: 0.35  # Lowered from 0.5 to pick up partially occluded players in crowds
  ball_confidence: 0.3
  jersey_confidence: 0.4
  batch_size: 8
  max_detections: 12
  player_iou_nms: 0.35  # NMS IoU threshold - lower = allow closer overlapping players (default 0.45)

  # Geometry filtering (reject pathological YOLO false positives)
  min_height: 30  # Minimum player bbox height in pixels
  max_height: 800  # Maximum player bbox height in pixels (even in 4K)
  max_width: 600  # Maximum player bbox width in pixels
  min_aspect_ratio: 0.2  # Minimum width/height ratio
  max_aspect_ratio: 2.0  # Maximum width/height ratio
  max_area_fraction: 0.25  # Maximum fraction of frame area (25% = reject huge detections)

# Tracking Parameters (Pass 1 - IoU + motion only, NO team/appearance gating)
tracking:
  track_high_thresh: 0.5  # Lowered from 0.6 to start tracking partially occluded players
  track_low_thresh: 0.1  # Keep tracks alive with low confidence (good for occlusion)
  new_track_thresh: 0.35  # Lowered from 0.4 to pick up partially occluded players sooner
  match_thresh: 0.6  # Lowered from 0.8 to maintain tracks through crowds (less strict IoU matching)
  track_buffer: 30
  max_center_distance: 100.0
  velocity_weight: 0.3

# Pass 1 Storage Optimization
pass1:
  hsv_sample_stride: 5  # Store HSV histogram every N frames

# Team Clustering (Pass 3 - K-means only, run once at start)
team_clustering:
  n_clusters: 2
  kmeans_sample_limit: 50  # Max samples per fragment for K-means (was max_samples)
  bins: 32  # HSV histogram bins per channel (96 total = 32 × 3)
  team_cap: 6  # Max 6 players per team
  unknown_recovery_min_margin: 0.12
  unknown_recovery_min_ratio: 1.04
  unknown_recovery_anchor_gap_frames: 5
  unknown_replacement_enabled: true
  unknown_replacement_min_margin: 0.45
  unknown_replacement_min_ratio: 1.20
  unknown_replacement_max_loser_frames: 260
  unknown_replacement_max_age_delta_frames: 90
  retro_track_max_anchor_gap_frames: 5
  retro_track_min_source_confidence: 1.5  # Lower threshold to backfill weak jersey assignments
  continuity_lock_window_frames: 12  # Lock fragments starting soon after identity jumps
  color_correction_min_duration_frames: 20
  color_correction_min_margin: 0.35
  color_correction_min_ratio: 1.12
  identity_anchor_gap_max_frames: 140
  identity_anchor_gap_max_mid_fragments: 4
  # Intra-team appearance sub-clustering (PoC: metadata-only, no feedback)
  appearance_variance_ratio_threshold: 1.5  # If var(team) > 1.5 × min(other_var), mark as multi-appearance
  max_appearance_modes: 3  # Hard cap on modes per team (MiniBatchKMeans k ≤ 3)

# Jersey Inference (Pass 3 - bibbed team only)
jersey:
  lock_threshold: 1.5  # Cumulative confidence for jersey lock (raised from 1.0 to reduce false positives)
  min_detections: 3  # Minimum number of jersey detections required (raised from 2 for reliability)
  min_coverage_pct: 0.15  # Minimum temporal coverage (raised from 0.10 to require more evidence)
  min_stability_frames: 20  # Minimum frames for stable inference (raised from 15)
  frame_stride: 5  # Classify every N frames
  cross_team_overlap_min_frames: 8
  cross_team_weak_confidence_max: 5.0
  cross_team_strong_confidence_min: 12.0
  name_map:
    10: "Kikis"
    7: "Rick"
    4: "Spyros"

# Pass 3: Crop Export (futsal-tuned for green bib preservation)
pass3:
  # Crop selection strategy
  save_team_crops: true
  crops_per_fragment: 6  # Target crops per fragment (was team_crops_per_fragment)
  min_crops_per_team: 15  # Minimum total crops per team (reduced from 20 for futsal)
  crop_mode: "jersey"  # histogram_source | jersey | full
  crops_input_dir: "videos/input"

  # Quality thresholds (futsal-tuned, color-agnostic)
  quality_threshold: 0.35  # Standard threshold for all crops (futsal-relaxed)
  quality_threshold_high_confidence: 0.70  # Immediate accept threshold (skip other checks)

  # Isolation checks (futsal-relaxed for tight player spacing)
  proximity_threshold_px: 24  # Minimum distance between crops (reduced from 28 for futsal)
  iou_threshold: 0.010  # Maximum IoU overlap (increased from hardcoded 0.005)

  # Candidate selection
  candidate_multiplier: 3  # Collect N×target candidates before filtering (was hardcoded)
  fallback_promotion_threshold: 3  # Promote best fallback if ≥N fallbacks exist (was hardcoded)

# Homography - Pixel to Court Coordinate Mapping
homography:
  # Standard futsal court dimensions (meters)
  court_length: 40.0
  court_width: 20.0
  goal_width: 3.0
  output_pixel_scale: 20  # Pixels per meter for 2D pitch (800x400 output)

  # Calibration points - pixel coordinates from video frame
  source_points:
    - [680, 595]    # 1. Far Left Corner
    - [843, 638]    # 2. Left Red (PA Far Corner)
    - [147, 1075]   # 3. Left Blue (PA Near Corner)
    - [3136, 611]   # 4. Far Right Corner
    - [2964, 650]   # 5. Right Red (PA Far Corner)
    - [3644, 1100]  # 6. Right Blue (PA Near Corner)
    - [1900, 530]   # 7. Center Black X (Far Touchline)
    - [1888, 1592]  # 8. Center Black X (Near Touchline)
    - [303, 772]    # 9. Left Purple (Goal Post Far)
    - [128, 875]    # 10. Left Orange (Goal Post Near)
    - [3511, 808]   # 11. Right Purple (Goal Post Far)
    - [3692, 907]   # 12. Right Orange (Goal Post Near)
    - [1891, 760]   # 13. Center Circle

  # Real-world court coordinates in meters
  dest_points:
    - [0.0, 19.0]   # 1. Far Left Corner
    - [3.5, 17.0]   # 2. Left Red (PA Far Corner) - 3.5m depth
    - [3.5, 5.0]    # 3. Left Blue (PA Near Corner) - 3.5m depth
    - [40.0, 19.0]  # 4. Far Right Corner
    - [36.5, 17.0]  # 5. Right Red (PA Far Corner) - 3.5m depth
    - [36.5, 5.0]   # 6. Right Blue (PA Near Corner) - 3.5m depth
    - [20.0, 19.0]  # 7. Center Black X (Far Touchline)
    - [20.0, 1.0]   # 8. Center Black X (Near Touchline)
    - [0.0, 11.5]   # 9. Left Purple (Goal Post Far)
    - [0.0, 8.5]    # 10. Left Orange (Goal Post Near)
    - [40.0, 11.5]  # 11. Right Purple (Goal Post Far)
    - [40.0, 8.5]   # 12. Right Orange (Goal Post Near)
    - [20.0, 10.0]  # 13. Center Circle

# Pass 2: Divergence Detection (Frame-Explainable Track Splitting)
divergence:
  # Track crossing detection
  crossing_threshold_meters: 1.0  # Spatial proximity for potential track crossing

  # Velocity spike detection
  velocity_spike_threshold: 5.0  # m/s change between frames (at 30 FPS)
  velocity_window_frames: 3  # Compute velocity over N frame window

  # BBox jump detection
  bbox_jump_threshold_meters: 2.0  # Sudden position jump (teleporting)

  # Occlusion spike detection
  occlusion_threshold: 0.6  # Confidence drop indicating occlusion (1 - confidence)
  occlusion_window_frames: 5  # Check for sustained occlusion over N frames

  # APPEARANCE DRIFT DETECTION (for T5 orange→white swap bug + intra-team swaps)
  # Lowered to catch intra-team identity swaps (T8 jumping to #4 player at frame 700)
  appearance_threshold: 2.5  # Chi-squared distance threshold for appearance-based splits. Lower = more splits
  appearance_window: 7  # Number of histogram samples to compare (baseline vs test)
  appearance_min_consecutive: 2  # Require N consecutive drift hits before splitting
  appearance_threshold_strong: 6.0  # Immediate split if a single jump exceeds this distance
  appearance_debug:
    enabled: true
    track_id: "2"
    frame_start: 820
    frame_end: 870

  # OVERLAP CONTAMINATION + RETROACTIVE CONTRADICTION SPLITTING
  # Frames are contamination-flagged when nearby tracks make appearance/jersey evidence unreliable.
  # If a split occurs in contamination and stable pre/post signatures contradict, force retroactive split.
  overlap_contamination:
    enabled: true
    proximity_threshold_pixels: 64.0
    iou_threshold: 0.08
    signature_window_frames: 6
    appearance_contradiction_threshold: 6.0
    bib_presence_threshold: 0.5
    bib_absence_threshold: 0.2
    debug:
      enabled: true
      track_id: "2"
      frame_start: 820
      frame_end: 930
    audit:
      enabled: true
      track_id: "2"
      frame_start: 820
      frame_end: 930

  # JERSEY NUMBER INCONSISTENCY DETECTION (for same-color shirt, different numbers)
  # DISABLED: Appearance alone may not distinguish same-color shirts with/without numbers
  # Re-enable only if empirical testing shows appearance distance reliably > 3.0 for number changes
  jersey_inconsistency_enabled: false  # DISABLED - too many false positives (camera angle changes)
  jersey_appear_threshold: 0.5  # Min confidence for "jersey number appeared" signal
  jersey_disappear_threshold: 0.3  # Max confidence for "jersey number disappeared" signal
  jersey_consistency_window: 10  # Number of jersey samples to check for consistency

  # JERSEY TEMPORAL EXCLUSIVITY POST-PROCESSING (for track jumps between same-appearance players)
  # Detects when a jersey disappears from Fragment A and appears on Fragment B shortly after
  # This catches cases like T8 (black no-number) → T8 (black #4) at frame ~700
  # CRITICAL: This threshold must be LOWER than Pass 3 thresholds to catch all potential duplicates
  jersey_temporal_exclusivity:
    enabled: true  # Enable jersey temporal conflict detection
    appear_threshold: 0.5  # Must be lower than Pass 3 to catch all duplicates before team clustering
    temporal_window_frames: 150  # Max frame gap to consider jersey jump (at 30 FPS = ~5 seconds)

  # Fragment splitting
  min_fragment_length: 10  # Minimum frames for a valid fragment

# Ghost Tracking (Pass 2 - Maintain Player Count Invariant)
ghost_tracking:
  enabled: true
  level_init_frames: 30  # Compute initial level from first 30 frames
  # NOTE: level is NOT a config parameter - it's computed from the clip
  # Ghosts NEVER auto-expire - they only close on reappearance

# Pass 3: Pileup Detection (Explicit Failure Marking)
pileup:
  spatial_radius_meters: 1.5  # Radius for considering fragments overlapping
  min_duration_frames: 15  # Minimum frames to mark as unreliable_window

# Output
output:
  save_debug_frames: false
  debug_frame_step: 30
  save_crops: false
